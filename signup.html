<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <link href="./assets/output.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Document</title>
</head>
<body>
    <form class="flex justify-around border">
        <div class="grid gap-2">
          <div class="flex justify-center">
            <img src="assets/images/logo.png" alt="icone">
          </div>  
          <h1 class="text-4xl font-medium">Create an account</h1>
          <p class="text-xl font-thin flex justify-center color-gray">Start your 30-days free trial</p>
          <input type="email" name="email" id="email" placeholder="Enter your email" class="mt-1 p-2 w-full border grow py-1.5 pr-3 pl-1 text-base text-gray-900 placeholder:text-gray-400 focus:outline-none sm:text-sm/6 rounded border">
          <button type="submit" class="mt-1 p-2 w-full bg-blue-500 hover:bg-blue-600 text-white rounded">Get Started</button>
          <div class="flex items-center justify-center">
            <hr class="border-t border-gray-300 w-1/3">
            <span class="mx-4 text-gray-500">OR</span>
            <hr class="border-t border-gray-300 w-1/3">
          </div>
          <div class="relative ">
            <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                <img src="assets/images/Social icon-1.jpg" alt="googleicone" class="mb-2">
            </div>
            <button type="button" class="mt-1 p-2 w-full border rounded">Sign in with Google</button>
          </div>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                <img src="assets/images/Vector.jpg" alt="facebookicone" class="mb-2">
            </div>
            <button type="button" class="mt-1 p-2 w-full border rounded">Sign in with Facebook</button>
          </div>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                <img src="assets/images/Social icon.jpg" alt="appleicone" class="mb-2">
            </div>
            <button type="button" class="mt-1 p-2 w-full border rounded">Sign in with Apple</button>
          </div>
          <div class="text-center">
            Already have an account? <a href="#" class="text-blue-500">Log in</a>
          </div>
        </div>
      </form>
   
   


    <script src="signup.js"></script>
</body>
</html>
