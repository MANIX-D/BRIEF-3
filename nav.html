<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navbar Example</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
 <!-- Navbar -->
 <nav class="fixed w-full bg-blue-200 p-2 shadow-md mt-4">
    <div class="container mx-auto flex justify-start items-center">
      
      <!-- Logo and Brand Name -->
      <div class="flex items-center">
        <img src="/assets/logo.png" alt="Logo" class="h-10 w-10 mr-2"> <!-- Remplacez par l'URL de votre logo -->
        <span class="font-bold text-lg">WebNova</span>
      </div>

      <!-- Menu Items for Desktop -->
      <div class="hidden md:flex space-x-8 text-lg font-semibold ml-10">
        <a href="#" class="hover:text-blue-700">ACCUEIL</a>
        <a href="#" class="hover:text-blue-700">CV</a>
      </div>

      <!-- Login and Signup Buttons for Desktop (pushed to right with margin-left-auto) -->
      <div class="hidden md:flex items-center space-x-4 ml-auto">
        <a href="#" class="text-black font-semibold hover:text-blue-700">Log in</a>
        <a href="#" class="bg-blue-700 text-white px-4 py-2 rounded-md shadow-md hover:bg-blue-800">Sign up</a>
      </div>

      <!-- Mobile menu button -->
      <div class="md:hidden ml-auto">
        <button onclick="toggleMenu()" class="focus:outline-none">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Mobile Menu (Hidden by default) -->
    <div id="mobile-menu" class="hidden md:hidden">
      <div class="flex flex-col space-y-2 p-4 text-lg font-semibold">
        <a href="index.html" class="hover:text-blue-700">ACCUEIL</a>
        <a href="cv.html" class="hover:text-blue-700">CV</a>
        <a href="login.html" class="hover:text-blue-700">Log in</a>
        <a href="signup.html" class="bg-blue-700 text-white px-4 py-2 rounded-md shadow-md hover:bg-blue-800 text-center">Sign up</a>
      </div>
    </div>
  </nav>

</body>
</html>
