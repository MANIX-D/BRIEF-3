<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="assets/cv.css" />
    <link href="/assets/output.css" rel="stylesheet" />
    <link rel="stylesheet" href="cv.css" />
    <style>
        /* Ajout de la barre de défilement */
        .scrollbar {
            overflow-y: auto;
            max-height: 600px;
        }

        .scrollbar::-webkit-scrollbar {
            width: 8px;
        }

        .scrollbar::-webkit-scrollbar-thumb {
            background-color: #888;
            border-radius: 4px;
        }

        .scrollbar::-webkit-scrollbar-thumb:hover {
            background-color: #555;
        }
    </style>
</head>

<body class="bg-gray-100 text-sm">
    <!-- Navbar -->
    <nav class="fixed w-full bg-blue-200 p-2 shadow-md mt-4 text-sm">
        <div class="container mx-auto flex justify-start items-center ml-auto">
            <!-- Logo and Brand Name -->
            <div class="flex items-center">
                <img src="/assets/logo.png" alt="Logo" class="h-10 w-10 mr-2" />
                <span class="font-bold text-sm">WebNova</span>
            </div>

            <!-- Menu Items for Desktop -->
            <div class="hidden md:flex space-x-8 text-sm font-semibold ml-10">
                <a href="index.html" class="hover:text-blue-700">ACCUEIL</a>
                <a href="cv.html" class="hover:text-blue-700">CV</a>
            </div>

            <!-- Login and Signup Buttons for Desktop (pushed to right with margin-left-auto) -->
            <div class="hidden md:flex items-center space-x-4 ml-auto text-sm">
                <a href="login.html" class="text-black font-semibold hover:text-blue-700">Log in</a>
                <a href="signup.html" class="bg-blue-700 text-white px-2 py-2 rounded-md shadow-md hover:bg-blue-800">Sign up</a>
            </div>

            <!-- Mobile menu button -->
            <div class="md:hidden ml-auto">
                <button onclick="toggleMenu()" class="focus:outline-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Mobile Menu (Hidden by default) -->
        <div id="mobile-menu" class="hidden md:hidden">
            <div class="flex flex-col space-y-2 p-4 text-lg font-semibold">
                <a href="index.html" class="hover:text-blue-700">ACCUEIL</a>
                <a href="cv.html" class="hover:text-blue-700">CV</a>
                <a href="login.html" class="hover:text-blue-700">Log in</a>
                <a href="signup.html"
                    class="bg-blue-700 text-white px-4 py-2 rounded-md shadow-md hover:bg-blue-800 text-center">Sign
                    up</a>
            </div>
        </div>
    </nav>
  
    <div class="container mx-auto p-6">
        <h1 class="text-3xl font-bold mb-6">Création de CV</h1>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Formulaire CV -->
            <div class="p-6 rounded-lg shadow-md scrollbar bg-blue-200">
                <h2 class="text-xl font-bold mb-4">Formulaire</h2>
                <form id="cv-form">
                    <!-- Informations personnelles -->
                    <section class="mb-6">
                        <h3 class="text-xl font-semibold mb-4 sticky top-0 bg-white px-4 py-2 shadow-sm">Informations personnelles</h3>
                        <div class="space-y-4">
                            <div>
                                <label for="nom" class="block text-sm font-medium text-gray-700">Nom complet</label>
                                <input type="text" id="nom"
                                    class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm" required />
                            </div>
                            <div>
                                <label for="age" class="block text-sm font-medium text-gray-700">Âge</label>
                                <input type="number" id="age"
                                    class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm" required />
                            </div>
                            <div>
                                <label for="sexe" class="block text-sm font-medium text-gray-700">Sexe</label>
                                <select id="sexe"
                                    class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm" required>
                                    <option>Masculin</option>
                                    <option>Féminin</option>
                                    <option>Autre</option>
                                </select>
                            </div>
                            <div>
                                <label for="titre" class="block text-sm font-medium text-gray-700">Titre du poste</label>
                                <input type="text" id="titre"
                                    class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm" required />
                            </div>
                            <div>
                                <label for="situation" class="block text-sm font-medium text-gray-700">Situation actuelle</label>
                                <input type="text" id="situation"
                                    class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm" required />
                            </div>
                            <div>
                                <label for="description"
                                    class="block text-sm font-medium text-gray-700">Description</label>
                                <textarea id="description" rows="3"
                                    class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm"
                                    required></textarea>
                            </div>
                            <div>
                                <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                                <input type="email" id="email"
                                    class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm" required />
                            </div>
                            <div>
                                <label for="telephone" class="block text-sm font-medium text-gray-700">Téléphone</label>
                                <input type="tel" id="telephone"
                                    class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm" required />
                            </div>
                            <div>
                                <label for="adresse" class="block text-sm font-medium text-gray-700">Adresse</label>
                                <input type="text" id="adresse"
                                    class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm" required />
                            </div>
                            <div>
                                <label for="photo" class="block text-sm font-medium text-gray-700">Photo de profil</label>
                                <input type="file" id="photo" accept="image/*" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm" />
                                <img id="profile-photo-preview" src="" alt="Aperçu de la photo de profil" class="hidden" />
                            </div>
                        </div>
                    </section>

                    <!-- Expériences professionnelles -->
                    <section class="mb-6">
                        <h3 class="text-xl font-semibold mb-4 sticky top-0 bg-white px-4 py-2 shadow-sm">Expériences professionnelles</h3>
                        <div class="space-y-4">
                            <div>
                                <label for="entreprise"
                                    class="block text-sm font-medium text-gray-700">Nom de l'entreprise</label>
                                <input type="text" id="entreprise"
                                    class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm" required />
                            </div>
                            <div>
                                <label for="poste" class="block text-sm font-medium text-gray-700">Poste occupé</label>
                                <input type="text" id="poste"
                                    class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm" required />
                            </div>
                            <div>
                                <label for="duree" class="block text-sm font-medium text-gray-700">Durée</label>
                                <input type="text" id="duree"
                                    class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm" required />
                            </div>
                            <div>
                                <label for="missions" class="block text-sm font-medium text-gray-700">Description des missions</label>
                                <textarea id="missions" rows="3"
                                    class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm"
                                    required></textarea>
                            </div>
                        </div>
                    </section>

                    <!-- Formation -->
                    <section class="mb-6">
                        <h3 class="text-xl font-semibold mb-4 sticky top-0 bg-white px-4 py-2 shadow-sm">Formation</h3>
                        <div class="space-y-4">
                            <div>
                                <label for="diplome" class="block text-sm font-medium text-gray-700">Diplôme obtenu</label>
                                <input type="text" id="diplome"
                                    class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm" required />
                            </div>
                            <div>
                                <label for="etablissement" class="block text-sm font-medium text-gray-700">Établissement</label>
                                <input type="text" id="etablissement"
                                    class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm" required />
                            </div>
                            <div>
                                <label for="annee" class="block text-sm font-medium text-gray-700">Année d'obtention</label>
                                <input type="text" id="annee"
                                    class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm" required />
                            </div>
                        </div>
                    </section>

                    <!-- Compétences -->
                    <section class="mb-6">
                        <h3 class="text-xl font-semibold mb-4 sticky top-0 bg-white px-4 py-2 shadow-sm">Compétences</h3>
                        <div>
                            <label for="competences" class="block text-sm font-medium text-gray-700">Liste des compétences</label>
                            <textarea id="competences" rows="3"
                                class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm"
                                required></textarea>
                        </div>
                    </section>

                    <!-- Centres d'intérêt -->
                    <section class="mb-6">
                        <h3 class="text-xl font-semibold mb-4">Centres d'intérêt</h3>
                        <div>
                            <label for="interets" class="block text-sm font-medium text-gray-700">Centres d'intérêt</label>
                            <textarea id="interets" rows="3"
                                class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm"
                                required></textarea>
                        </div>
                    </section>

                    <!-- Références -->
                    <section class="mb-6">
                        <h3 class="text-xl font-semibold mb-4 sticky top-0 bg-white px-4 py-2 shadow-sm">Références</h3>
                        <div class="space-y-4">
                            <div>
                                <label for="referenceNom" class="block text-sm font-medium text-gray-700">Nom de la
                                    référence</label>
                                <input type="text" id="referenceNom"
                                    class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm" required />
                            </div>
                            <div>
                                <label for="referencePoste" class="block text-sm font-medium text-gray-700">Poste de la
                                    référence</label>
                                <input type="text" id="referencePoste"
                                    class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm" required />
                            </div>
                            <div>
                                <label for="referenceContact"
                                    class="block text-sm font-medium text-gray-700">Contact de la référence</label>
                                <input type="text" id="referenceContact"
                                    class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm" required />
                            </div>
                        </div>
                    </section>

                    <!-- Langues -->
                    <section class="mb-6">
                        <h3 class="text-xl font-semibold mb-4 sticky top-0 bg-white px-4 py-2 shadow-sm">Langues</h3>
                        <div>
                            <label for="langues" class="block text-sm font-medium text-gray-700">Langues maîtrisées</label>
                            <textarea id="langues" rows="3"
                                class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm"
                                required></textarea>
                        </div>
                    </section>

                    <div class="flex justify-end mt-4">
                        <button type="reset" class="bg-red-500 text-white px-4 py-2 rounded-md hover:bg-red-600">Réinitialiser</button>
                    </div>
                </form>
            </div>

            <!-- CV -->
            <div class="p-6 bg-white rounded-lg shadow-md scrollbar" id="cv-preview">
                <h2 class="text-xl font-bold mb-4">Aperçu du CV</h2>
                <div id="cv-content">
                    <!-- Le contenu du CV généré apparaîtra ici -->
                </div>
                <button id="download-btn"
                    class="bg-green-500 text-white px-4 py-2 rounded-md mt-4 hover:bg-green-600">Télécharger le CV</button>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('cv-form');
        const cvPreview = document.getElementById('cv-content');
        const downloadBtn = document.getElementById('download-btn');
        const photoInput = document.getElementById('photo');
        const photoPreview = document.getElementById('profile-photo-preview');

        form.addEventListener('input', updateCVPreview);

        // Fonction pour mettre à jour l'aperçu du CV en temps réel
        function updateCVPreview() {
            const nom = document.getElementById('nom').value;
            const age = document.getElementById('age').value;
            const sexe = document.getElementById('sexe').value;
            const titre = document.getElementById('titre').value;
            const situation = document.getElementById('situation').value;
            const description = document.getElementById('description').value;
            const email = document.getElementById('email').value;
            const telephone = document.getElementById('telephone').value;
            const adresse = document.getElementById('adresse').value;
            const entreprise = document.getElementById('entreprise').value;
            const poste = document.getElementById('poste').value;
            const duree = document.getElementById('duree').value;
            const missions = document.getElementById('missions').value;
            const diplome = document.getElementById('diplome').value;
            const etablissement = document.getElementById('etablissement').value;
            const annee = document.getElementById('annee').value;
            const competences = document.getElementById('competences').value;
            const interets = document.getElementById('interets').value;
            const referenceNom = document.getElementById('referenceNom').value;
            const referencePoste = document.getElementById('referencePoste').value;
            const referenceContact = document.getElementById('referenceContact').value;
            const langues = document.getElementById('langues').value;

            // Générer le contenu du CV
            cvPreview.innerHTML = `
                <img src="${photoPreview.src}" alt="Photo de profil" class="w-24 h-24 rounded-full mb-4">
                <h3 class="text-2xl font-bold">${nom}</h3>
                <p>${titre}</p>
                <p>${situation}</p>
                <p class="mt-4"><strong>Description :</strong> ${description}</p>
                <p><strong>Contact :</strong> ${email} | ${telephone}</p>
                <p><strong>Adresse :</strong> ${adresse}</p>

                <h4 class="text-xl font-bold mt-6">Expériences professionnelles</h4>
                <p><strong>${poste}</strong> chez ${entreprise} (${duree})</p>
                <p>${missions}</p>

                <h4 class="text-xl font-bold mt-6">Formation</h4>
                <p><strong>${diplome}</strong> - ${etablissement} (${annee})</p>

                <h4 class="text-xl font-bold mt-6">Compétences</h4>
                <p>${competences}</p>

                <h4 class="text-xl font-bold mt-6">Centres d'intérêt</h4>
                <p>${interets}</p>

                <h4 class="text-xl font-bold mt-6">Références</h4>
                <p><strong>${referenceNom}</strong> - ${referencePoste}</p>
                <p>${referenceContact}</p>

                <h4 class="text-xl font-bold mt-6">Langues</h4>
                <p>${langues}</p>
            `;
        }

        // Prévisualisation de la photo de profil
        photoInput.addEventListener('change', function () {
            const file = photoInput.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    photoPreview.src = e.target.result;
                    photoPreview.classList.remove('hidden');
                    updateCVPreview(); // Mettre à jour l'aperçu
                };
                reader.readAsDataURL(file);
            }
        });

        // Télécharger le CV en tant que PDF
        downloadBtn.addEventListener('click', function () {
            const element = document.getElementById('cv-preview');
            html2pdf()
                .from(element)
                .save();
        });

        // Bouton de réinitialisation
const resetButton = document.querySelector('button[type="reset"]');

resetButton.addEventListener('click', function () {
    // Réinitialiser manuellement le champ de sélection de sexe
    document.getElementById('sexe').selectedIndex = 0;

    // Réinitialiser la photo de profil
    photoPreview.src = '';
    photoPreview.classList.add('hidden'); // Masquer l'aperçu de la photo
});
  
    </script>
</body>

</html>
